name: CI

on:
  push:
    branches: [main, integration]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, curl, dom, fileinfo, gd, intl, mbstring, pcntl, pdo, pdo_mysql, pdo_sqlite, sqlite3, xml, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Audit Composer dependencies
        run: composer audit --no-interaction --format=plain

      - name: Verify test database extensions
        run: |
          php -r 'foreach (["pdo_sqlite", "sqlite3"] as $extension) { if (! extension_loaded($extension)) { fwrite(STDERR, "Missing PHP extension: ".$extension.PHP_EOL); exit(1); } }'

      - name: Run backend tests
        run: |
          set +e
          php artisan test --compact > /tmp/backend-test-output.json 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            {
              echo '## Backend test failure (first 12 KiB)'
              head -c 12000 /tmp/backend-test-output.json
            } >> "$GITHUB_STEP_SUMMARY"
            annotation=$(head -c 3000 /tmp/backend-test-output.json | tr '\n' ' ' | tr '\r' ' ')
            echo "::error file=backend/tests::$annotation"
          fi
          cat /tmp/backend-test-output.json
          exit "$status"

      - name: Upload backend test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-output
          path: /tmp/backend-test-output.json
          if-no-files-found: error

      - name: Check PHP formatting
        run: ./vendor/bin/pint --test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_USE_MOCKS: '0'
      NEXT_PUBLIC_ENABLE_PROTOTYPES: '0'
      NEXT_PUBLIC_SHOW_DEV_TOOLS: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify client contracts
        run: npm run test:client-demo

      - name: Type-check frontend
        run: npx tsc --noEmit

      - name: Lint frontend
        run: npm run lint

      - name: Build production frontend without mocks
        run: npm run verify:no-mocks
