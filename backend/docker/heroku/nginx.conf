# nginx inside the Heroku image (Dockerfile.heroku). The server block is
# nginx.prod.conf's; the rest exists because a dyno assigns the port (web.sh
# fills in __PORT__) and runs as a non-root user, so everything nginx writes
# lives under /tmp.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    # The Heroku router already logs every request.
    access_log off;

    client_body_temp_path /tmp/nginx/client-body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    server {
        listen __PORT__;
        server_name _;
        root /var/www/html/public;
        index index.php;

        charset utf-8;
        server_tokens off;
        # Matches post_max_size in php-production.ini.
        client_max_body_size 64m;

        # What Caddy adds in front of the API on the Compose deploy. The pages'
        # own headers (CSP, framing, permissions) come from Next.js.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # Company logos when FILE_STORAGE=local (see nginx.prod.conf). With
        # buckets they are linked at AWS_PUBLIC_URL instead.
        location ^~ /storage/company-logos/ {
            alias /var/www/html/storage/app/public/company-logos/;
            expires 7d;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            try_files $uri =404;
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTP_PROXY "";
            # The Heroku router answers 503 after 30 s whatever this says.
            fastcgi_read_timeout 300s;
        }

        location ~ /\. {
            deny all;
        }
    }
}
