; Loaded after the base image's zz-docker.conf. A Basic dyno has 512 MB for
; nginx, these children and, with RUN_WORKER_IN_WEB=1, the queue worker and
; Whisper too, so the pool stays small.
[www]
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 4
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 2
pm.max_requests = 500
; nginx and the Heroku router already log each request.
access.log = /dev/null
