server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    # Error pages (the 403 on /storage/) otherwise print the nginx version.
    server_tokens off;
    # Matches post_max_size in php-production.ini. Also bounds chunked bodies,
    # which carry no Content-Length for PHP to refuse up front.
    client_max_body_size 64m;

    # Only the public disk's company logos are files nginx may serve itself.
    # Everything else under /storage/ is a *private* file (documents, the
    # presentation video, audio): it is released by Laravel's signed route of
    # the same prefix, which has to reach PHP. A blanket alias to the public
    # disk answered those requests with a 404 before Laravel ever saw them.
    location ^~ /storage/company-logos/ {
        alias /var/www/html/storage/app/public/company-logos/;
        access_log off;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass backend:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 300s;
    }

    location ~ /\. {
        deny all;
    }
}
