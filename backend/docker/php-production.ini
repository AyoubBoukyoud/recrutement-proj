expose_php=Off
; The image ships no php.ini, so PHP's built-in display_errors=1 applies to
; anything emitted before Laravel boots (request parsing). Log, never print.
display_errors=Off
display_startup_errors=Off
log_errors=On
; Stack traces otherwise quote call arguments, which put live OTP codes
; (OtpChannelManager->send($phone, $code, …)) into the logs.
zend.exception_ignore_args=On
; Unused (Laravel keeps its own sessions) and the confirmed attack path of
; CVE-2026-109619. Must be set here, not via ini_set(), to take effect.
session.upload_progress.enabled=0
memory_limit=512M
; The largest upload the API accepts is the 50 MB presentation video
; (CandidateProfileController). Keep nginx's client_max_body_size in step.
upload_max_filesize=55M
post_max_size=64M
max_execution_time=300
max_input_time=300
opcache.enable=1
opcache.enable_cli=1
opcache.validate_timestamps=0
opcache.memory_consumption=192
opcache.max_accelerated_files=20000
realpath_cache_size=4096K
realpath_cache_ttl=600
