name: recruitment

x-backend-environment: &backend-environment
  APP_NAME: Recruitment
  APP_ENV: production
  APP_KEY: ${APP_KEY:?APP_KEY must be set in deploy/.env.prod}
  APP_DEBUG: "false"
  APP_URL: ${PUBLIC_URL:?PUBLIC_URL must be set in deploy/.env.prod}
  ADMIN_DASHBOARD_URL: ${PUBLIC_URL:?PUBLIC_URL must be set in deploy/.env.prod}
  APP_LOCALE: fr
  APP_FALLBACK_LOCALE: en
  LOG_CHANNEL: stderr
  LOG_LEVEL: ${LOG_LEVEL:-warning}
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_DATABASE: ${MYSQL_DATABASE:-recruitment}
  DB_USERNAME: ${MYSQL_USER:-recruitment}
  DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in deploy/.env.prod}
  SESSION_DRIVER: database
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
  SANCTUM_STATEFUL_DOMAINS: ${DOMAIN_HOSTS:-51.170.131.162}
  QUEUE_CONNECTION: database
  CACHE_STORE: database
  FILESYSTEM_DISK: local
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
  OTP_CHANNELS: ${OTP_CHANNELS:-evolution,sms}
  # The way into the admin console on a database that has no administrator
  # yet: these numbers are granted the role on their first OTP request, and
  # the entrypoint provisions them as accounts. See deploy/README.md.
  ADMIN_PHONES: ${ADMIN_PHONES:-}
  ADMIN_PHONE_COUNTRY: ${ADMIN_PHONE_COUNTRY:-+212}
  EVOLUTION_BASE_URL: http://evolution-go:4000
  EVOLUTION_INSTANCE_TOKEN: ${EVOLUTION_INSTANCE_TOKEN:?EVOLUTION_INSTANCE_TOKEN must be set in deploy/.env.prod}
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
  TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
  TWILIO_FROM: ${TWILIO_FROM:-}
  COMPLAINT_ALERT_EMAIL: ${COMPLAINT_ALERT_EMAIL:-}
  COMPLAINT_SLACK_WEBHOOK: ${COMPLAINT_SLACK_WEBHOOK:-}

x-backend-service: &backend-service
  build:
    context: ../backend
    dockerfile: Dockerfile.prod
  restart: unless-stopped
  environment: *backend-environment
  volumes:
    - backend_storage:/var/www/html/storage
    - whisper_models:/var/www/html/storage/app/models

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://51.170.131.162}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      backend-web:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_USE_MOCKS: "0"
        NEXT_PUBLIC_ENABLE_PROTOTYPES: "0"
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    <<: *backend-service
    environment:
      <<: *backend-environment
      RUN_MIGRATIONS: "1"
    expose:
      - "9000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  backend-web:
    build:
      context: ../backend
      dockerfile: docker/nginx.Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - backend_storage:/var/www/html/storage:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/up"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  queue:
    <<: *backend-service
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=300", "--max-time=3600"]
    depends_on:
      backend-web:
        condition: service_healthy

  scheduler:
    <<: *backend-service
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      backend-web:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-recruitment}
      MYSQL_USER: ${MYSQL_USER:-recruitment}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in deploy/.env.prod}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in deploy/.env.prod}
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  evolution-postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD:?EVOLUTION_DB_PASSWORD must be set in deploy/.env.prod}
      POSTGRES_DB: postgres
    volumes:
      - evolution_db_data:/var/lib/postgresql/data
      - ../docker/evolution/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 20

  evolution-go:
    image: evoapicloud/evolution-go:0.7.2
    restart: unless-stopped
    environment:
      SERVER_PORT: "4000"
      CLIENT_NAME: evolution
      GLOBAL_API_KEY: ${EVOLUTION_GLOBAL_API_KEY:?EVOLUTION_GLOBAL_API_KEY must be set in deploy/.env.prod}
      POSTGRES_AUTH_DB: postgresql://evolution:${EVOLUTION_DB_PASSWORD}@evolution-postgres:5432/evogo_auth?sslmode=disable
      POSTGRES_USERS_DB: postgresql://evolution:${EVOLUTION_DB_PASSWORD}@evolution-postgres:5432/evogo_users?sslmode=disable
      DATABASE_SAVE_MESSAGES: "false"
      CONNECT_ON_STARTUP: "true"
      WADEBUG: INFO
      LOGTYPE: console
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - evolution_data:/app/dbdata
      - evolution_logs:/app/logs
    depends_on:
      evolution-postgres:
        condition: service_healthy

volumes:
  mysql_data:
  backend_storage:
  whisper_models:
  evolution_db_data:
  evolution_data:
  evolution_logs:
  caddy_data:
  caddy_config:
