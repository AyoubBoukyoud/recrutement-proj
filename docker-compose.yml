services:
  mysql:
    image: mysql:8.0
    container_name: recruitment_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-recruitment}
      MYSQL_USER: ${MYSQL_USER:-recruitment}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-recruitment}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin
    container_name: recruitment_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8081:80"
    depends_on:
      - mysql

  backend:
    build:
      context: ./backend
    container_name: recruitment_backend
    restart: unless-stopped
    environment: &backend_env
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: recruitment
      DB_USERNAME: recruitment
      DB_PASSWORD: recruitment
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # `evolution` d'abord, `sms` en repli ; `log` par défaut pour qu'un
      # checkout neuf se connecte sans passerelle (code renvoyé dans la réponse).
      OTP_CHANNELS: ${OTP_CHANNELS:-log}
      EVOLUTION_BASE_URL: http://evolution-go:4000
      EVOLUTION_INSTANCE_TOKEN: ${EVOLUTION_INSTANCE_TOKEN:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - backend_node_modules:/var/www/html/node_modules
      - backend_public_build:/var/www/html/public/build
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  queue:
    build:
      context: ./backend
    container_name: recruitment_queue
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=180"]
    environment: *backend_env
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - backend_node_modules:/var/www/html/node_modules
      - backend_public_build:/var/www/html/public/build
    depends_on:
      backend:
        condition: service_healthy

  # Passerelle WhatsApp auto-hébergée pour les codes OTP. Elle pilote un vrai
  # compte WhatsApp appairé par QR : aucun compte Business ni template validé
  # n'est requis, mais l'appairage doit être refait si la session est révoquée.
  # Voir SETUP.md § 6 pour l'appairage.
  evolution-postgres:
    image: postgres:15-alpine
    container_name: recruitment_evolution_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
      POSTGRES_DB: postgres
    volumes:
      - evolution_db_data:/var/lib/postgresql/data
      - ./docker/evolution/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  evolution-go:
    # Pin the gateway: `latest` changed its activation/runtime contract and
    # silently broke a previously paired OTP stack after an image refresh.
    image: evoapicloud/evolution-go:0.7.2
    container_name: recruitment_evolution_go
    restart: unless-stopped
    environment:
      SERVER_PORT: "4000"
      CLIENT_NAME: evolution
      GLOBAL_API_KEY: ${EVOLUTION_GLOBAL_API_KEY:-change-me-global-key}
      POSTGRES_AUTH_DB: postgresql://evolution:evolution@evolution-postgres:5432/evogo_auth?sslmode=disable
      POSTGRES_USERS_DB: postgresql://evolution:evolution@evolution-postgres:5432/evogo_users?sslmode=disable
      DATABASE_SAVE_MESSAGES: "false"
      # Reprend la session appairée au redémarrage, sinon plus aucun code ne
      # part tant que personne n'a rappelé /instance/connect à la main.
      CONNECT_ON_STARTUP: "true"
      WADEBUG: INFO
      LOGTYPE: console
    ports:
      - "4000:4000"
    volumes:
      - evolution_data:/app/dbdata
      - evolution_logs:/app/logs
    depends_on:
      evolution-postgres:
        condition: service_healthy

volumes:
  mysql_data:
  evolution_db_data:
  evolution_data:
  evolution_logs:
  backend_vendor:
  backend_node_modules:
  backend_public_build:
